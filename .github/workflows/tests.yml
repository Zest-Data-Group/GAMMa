# Runs the unit tests on pushes to main and dev (day-to-day work lands on dev)
# and on every pull request. Browser (shinytest2) tests are skipped on CI via
# skip_on_ci(); everything else runs against the exact package versions in
# renv.lock.
name: tests

on:
  push:
    branches: [main, dev]
  pull_request:

jobs:
  test:
    # Pinned on purpose. `ubuntu-latest` moved to Ubuntu 26.04, where the s2
    # version in renv.lock (1.1.9, built from source) no longer installs, and
    # sf, leaflet, leaflet.extras and rmapshaper fail with it. 24.04 is what
    # the app is developed on. Move this when renv.lock is refreshed.
    runs-on: ubuntu-24.04
    env:
      RENV_CONFIG_REPOS_OVERRIDE: https://packagemanager.posit.co/cran/latest
      CI: true
    steps:
      - uses: actions/checkout@v4

      # libnode-dev: the prebuilt V8 package (needed by rmapshaper) links to
      # libnode.so and will not load without it.
      - name: System libraries for sf / terra / arrow / V8
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgdal-dev libgeos-dev libproj-dev libudunits2-dev \
            libcurl4-openssl-dev libssl-dev libxml2-dev libnode-dev

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-renv@v2

      - name: Run testthat
        run: Rscript tests/testthat.R
